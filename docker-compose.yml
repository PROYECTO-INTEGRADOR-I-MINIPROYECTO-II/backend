services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      REALTIME_URL: http://tiempo-real:3001
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tiempo-real:
    build: .
    command: ["node", "dist/tiempo-real.js"]
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (repo hermano ../frontend; su build lee ../frontend/.env, ver su .env.example).
  web:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - api
      - tiempo-real
